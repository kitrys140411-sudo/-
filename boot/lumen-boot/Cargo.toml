[package]
name = "lumen-boot"
description = "Lumen graphical UEFI boot loader"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
uefi = { version = "0.41", features = ["alloc", "global_allocator", "panic_handler"] }
bootcfg = { path = "../bootcfg" }
uefi-raw = "0.17"

[build-dependencies]
fontdue = "0.9"
ttf-parser = "0.21"
