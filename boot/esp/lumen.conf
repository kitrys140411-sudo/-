# Lumen boot loader configuration (\loader\lumen.conf on the ESP).
timeout = 5
default = lumen

[entry lumen]
title   = Lumen
kernel  = \lumen\vmlinuz.efi
initrd  = \lumen\initramfs.img
cmdline = root=PARTUUID=8d3a1c5e-2b7f-4c90-a1d4-6c756d656e32 rootwait console=ttyS0,115200 loglevel=6

[entry console]
title   = Lumen (console only)
kernel  = \lumen\vmlinuz.efi
initrd  = \lumen\initramfs.img
cmdline = root=PARTUUID=8d3a1c5e-2b7f-4c90-a1d4-6c756d656e32 rootwait console=ttyS0,115200 console=tty1 lumen.target=console

[entry firmware]
title  = Firmware settings
action = firmware

[entry poweroff]
title  = Power off
action = poweroff
