# UEFI bootloader workspace (target x86_64-unknown-uefi), separate from the Linux
# userspace workspace because it is built for a different, no_std target.
[workspace]
resolver = "3"
members = ["lumen-boot", "bootcfg"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
panic = "abort"
