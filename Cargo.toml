# Linux userspace of Lumen (target x86_64-unknown-linux-musl, built in the
# Alpine container). The UEFI boot loader lives in boot/ (separate workspace).
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"
rust-version = "1.97"

[workspace.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = "line-tables-only"
panic = "abort"

[profile.release-small]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
debug = false
strip = true
